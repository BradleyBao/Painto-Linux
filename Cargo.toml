[package]
name = "painto-linux"
# TODO: Update for each release and keep the AppStream release version in sync.
version = "0.3.0"
edition = "2024"
# Keep in sync with LICENSE and the AppStream project_license.
license = "MIT"

[dependencies]
gdk4 = "0.11.5"
gdk4-wayland = "0.11.5"
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_6"] }
gtk4-layer-shell = "0.8.1"
x11rb = { version = "0.13", features = ["shape"] }
